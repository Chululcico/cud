<style>
  :root{
    --black:#0a0a0c;
    --black-soft:#151517;
    --black-card:#1b1b1e;
    --red:#c8102e;
    --red-deep:#8a0b21;
    --white:#f5f4f0;
    --grey:#8c8c92;
    --grey-line:#2a2a2e;
    --maxw:1180px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--black);color:var(--white);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;position:relative;z-index:1;width:100%;}

  header.main-nav{position:sticky;top:0;z-index:100;background:rgba(10,10,12,0.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--grey-line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:76px;}
  .crest{display:flex;align-items:center;gap:12px;}
  .crest img.logo-img{width:38px;height:38px;border-radius:8px;object-fit:contain;flex-shrink:0;}
  .crest-text{line-height:1;}
  .crest-text .club{font-family:'Oswald';font-weight:700;font-size:16px;letter-spacing:0.03em;}
  .crest-text .sub{font-family:'JetBrains Mono';font-size:9px;letter-spacing:0.12em;color:var(--grey);margin-top:3px;display:block;}
  .nav-link{font-family:'JetBrains Mono';font-size:12px;letter-spacing:0.05em;color:var(--grey);transition:color .2s;}
  .nav-link:hover{color:var(--red);}

  .page{padding:64px 0 80px;flex:1;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--red);font-weight:700;display:block;margin-bottom:12px;}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;font-weight:700;line-height:1.05;}
  .page h1{font-size:clamp(30px,4.5vw,46px);color:var(--white);}
  .desc{color:var(--grey);font-size:14.5px;margin-top:14px;max-width:560px;line-height:1.6;}
  .desc strong{color:var(--white);}

  .contact-grid{display:flex;flex-direction:column;gap:16px;max-width:440px;margin:40px auto 0;}
  .contact-card{
    display:flex;align-items:center;gap:16px;padding:20px 24px;border-radius:8px;
    background:var(--black-soft);border:1px solid var(--grey-line);
    transition:border-color .2s,transform .2s;
  }
  .contact-card:hover{border-color:var(--red);transform:translateY(-2px);}
  .contact-card .icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-wa{background:#25D366;}
  .icon-ig{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af);}
  .contact-card .name{font-family:'Oswald';font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;display:block;}
  .contact-card .handle{font-family:'JetBrains Mono';font-size:11px;color:var(--grey);margin-top:3px;display:block;}

  .volver{
    display:inline-flex;align-items:center;gap:8px;margin-top:32px;
    border:1.5px solid var(--grey-line);background:transparent;color:var(--white);
    padding:12px 22px;font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.05em;border-radius:2px;transition:border-color .2s,color .2s;font-family:'Inter';
  }
  .volver:hover{border-color:var(--red);color:var(--red);}

  footer{padding:48px 0;text-align:center;border-top:1px solid var(--grey-line);}
  footer p{font-family:'JetBrains Mono';font-size:11px;color:var(--grey);}
  footer a{color:var(--red);}
</style>
</head>
